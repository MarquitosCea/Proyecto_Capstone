<ion-app>
  <ion-menu content-id="main-content" side="start">
    
    <ion-header class="ion-no-border">
      <ion-toolbar style="--background: #121212; border-bottom: 1px solid #333333;">
        <ion-title style="color: #2dd36f; font-weight: bold;">
          Geo<span style="color: #ff00b7;">Nyx</span>
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content style="--background: #1a1a1a;">
      
      <!-- CABECERA DE PERFIL DINÁMICA -->
      <div style="padding: 30px 20px; text-align: center; background: #222222; border-bottom: 1px solid #333333;">
        <ion-icon name="person-circle-outline" style="font-size: 80px; color: #555555;"></ion-icon>
        <h2 style="color: white; margin-top: 15px; font-size: 18px; font-weight: bold;">
          {{ estaLogueado ? '¡Hola ' + aliasUsuario + '!' : 'Modo Invitado' }}
        </h2>
        <p *ngIf="!estaLogueado" style="color: #aaaaaa; font-size: 14px; margin-top: 5px;">
          Únete para guardar tus misterios e historias locales.
        </p>
      </div>

      <!-- LISTA DE OPCIONES -->
      <ion-list style="background: transparent; padding-top: 15px;">
        
        <ng-container *ngIf="!estaLogueado">
          <ion-item button (click)="irALogin()" style="--background: transparent; --color: white;" lines="none">
            <ion-icon name="log-in-outline" slot="start" style="color: #2dd36f; font-size: 24px;"></ion-icon>
            <ion-label style="font-size: 16px;">Iniciar Sesión</ion-label>
          </ion-item>
          
          <ion-item button (click)="irARegistro()" style="--background: transparent; --color: white;" lines="none">
            <ion-icon name="person-add-outline" slot="start" style="color: #ff00b7; font-size: 24px;"></ion-icon>
            <ion-label style="font-size: 16px;">Registrarse</ion-label>
          </ion-item>
        </ng-container>

        <ng-container *ngIf="estaLogueado">
          <ion-item button (click)="irAMisHistorias()" style="--background: transparent; --color: white;" lines="none">
            <ion-icon name="book-outline" slot="start" style="color: #2dd36f; font-size: 24px;"></ion-icon>
            <ion-label style="font-size: 16px;">Mis Leyendas</ion-label>
          </ion-item>

          <ion-item button (click)="cerrarSesion()" style="--background: transparent;" lines="none">
            <ion-icon name="log-out-outline" slot="start" color="danger" style="font-size: 24px;"></ion-icon>
            <ion-label color="danger" style="font-size: 16px; font-weight: bold;">Cerrar Sesión</ion-label>
          </ion-item>
        </ng-container>

      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
